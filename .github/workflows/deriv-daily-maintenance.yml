name: Daily Deriv maintenance

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-deriv-maintenance
  cancel-in-progress: false

jobs:
  api-compatibility:
    name: Check public Deriv candle API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Request public candle history
        env:
          DERIV_APP_ID: ${{ vars.DERIV_APP_ID || '1089' }}
        run: |
          node --input-type=module <<'NODE'
          import WebSocket from "ws";
          const appId = process.env.DERIV_APP_ID;
          const url = `wss://ws.derivws.com/websockets/v3?app_id=${encodeURIComponent(appId)}`;
          const ws = new WebSocket(url);
          const timer = setTimeout(() => {
            console.error("Deriv API check timed out");
            ws.terminate();
            process.exit(1);
          }, 20000);
          ws.on("open", () => ws.send(JSON.stringify({
            ticks_history: "R_100",
            adjust_start_time: 1,
            count: 2,
            end: "latest",
            style: "candles",
            granularity: 60,
            req_id: 1
          })));
          ws.on("message", raw => {
            let data;
            try { data = JSON.parse(raw.toString()); } catch { return; }
            if (data.req_id !== 1) return;
            clearTimeout(timer);
            if (data.error) {
              console.error("Deriv API returned an error:", data.error.code, data.error.message);
              ws.close();
              process.exitCode = 1;
              return;
            }
            if (!Array.isArray(data.candles) || data.candles.length < 1) {
              console.error("Unexpected Deriv candle response shape");
              ws.close();
              process.exitCode = 1;
              return;
            }
            const candle = data.candles[data.candles.length - 1];
            for (const key of ["open", "high", "low", "close", "epoch"]) {
              if (!(key in candle)) {
                console.error("Candle response missing field:", key);
                ws.close();
                process.exitCode = 1;
                return;
              }
            }
            console.log(`Deriv public candle API OK: ${data.candles.length} candles; latest epoch ${candle.epoch}`);
            ws.close();
          });
          ws.on("error", err => {
            clearTimeout(timer);
            console.error("Deriv WebSocket connection failed:", err.message);
            process.exitCode = 1;
          });
          ws.on("close", () => clearTimeout(timer));
          NODE

  dependency-refresh:
    name: Create a tested dependency update PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve dependencies and refresh compatible versions
        run: |
          npm install --package-lock-only
          npm update
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Open or update dependency PR (never deploy automatically)
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/daily-dependency-refresh
          delete-branch: true
          title: "chore: daily dependency refresh"
          commit-message: "chore: refresh compatible npm dependencies"
          body: |
            Automated daily dependency refresh.

            - Resolves compatible npm updates within the ranges already declared in package.json.
            - Runs tests, TypeScript checks, and the production build before proposing changes.
            - Review this pull request and CI results before merging.
            - This workflow does not change trading strategies, risk limits, or enable live trading.
          labels: |
            dependencies
            automated-update
          add-paths: |
            package-lock.json
