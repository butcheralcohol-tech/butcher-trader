name: Daily Deriv maintenance

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-deriv-maintenance
  cancel-in-progress: false

jobs:
  api-compatibility:
    name: Check public Deriv candle API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Request public candle history
        env:
          DERIV_APP_ID: ${{ vars.DERIV_APP_ID || '1089' }}
        run: |
          node --input-type=module <<'NODE'
          import WebSocket from "ws";
          const appId = process.env.DERIV_APP_ID;
          // Same order the app uses: new public socket first, legacy socket as fallback.
          const endpoints = [
            { name: "new public API", url: "wss://api.derivws.com/trading/v1/options/ws/public" },
            { name: "legacy API", url: `wss://ws.derivws.com/websockets/v3?app_id=${encodeURIComponent(appId)}` },
          ];
          const check = ({ name, url }) => new Promise(resolve => {
            const ws = new WebSocket(url);
            let settled = false;
            const finish = (ok, detail) => { if (settled) return; settled = true; clearTimeout(timer); try { ws.terminate(); } catch {} resolve({ name, ok, detail }); };
            const timer = setTimeout(() => finish(false, "timed out after 20s"), 20000);
            ws.on("open", () => ws.send(JSON.stringify({ ticks_history: "R_100", adjust_start_time: 1, count: 2, end: "latest", style: "candles", granularity: 60, req_id: 1 })));
            ws.on("message", raw => {
              let data;
              try { data = JSON.parse(raw.toString()); } catch { return; }
              if (data.req_id !== 1) return;
              if (data.error) return finish(false, `API error ${data.error.code}: ${data.error.message}`);
              const candle = Array.isArray(data.candles) ? data.candles[data.candles.length - 1] : undefined;
              if (!candle) return finish(false, "unexpected response shape (no candles)");
              const missing = ["open", "high", "low", "close", "epoch"].filter(k => !(k in candle));
              if (missing.length) return finish(false, `candle missing fields: ${missing.join(", ")}`);
              finish(true, `${data.candles.length} candles, latest epoch ${candle.epoch}`);
            });
            ws.on("unexpected-response", (_req, res) => finish(false, `HTTP ${res.statusCode}`));
            ws.on("error", err => finish(false, `connection failed: ${err.message}`));
            ws.on("close", () => finish(false, "closed before a response"));
          });
          const results = [];
          for (const endpoint of endpoints) {
            const r = await check(endpoint);
            results.push(r);
            console.log(`${r.ok ? "OK  " : "FAIL"} ${r.name}: ${r.detail}`);
          }
          if (!results[0].ok && results[1].ok) console.log("::warning::New public Deriv API failed but the legacy API works. The app falls back to legacy; investigate.");
          if (!results[1].ok && results[0].ok) console.log("::warning::Legacy Deriv API is no longer working; the app is using the new public API.");
          if (!results.some(r => r.ok)) { console.log("::error::No Deriv candle endpoint is working."); process.exit(1); }
          NODE

  dependency-refresh:
    name: Create a tested dependency update PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve dependencies and refresh compatible versions
        run: |
          npm install --package-lock-only
          npm update
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Open or update dependency PR (never deploy automatically)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/daily-dependency-refresh
          delete-branch: true
          title: "chore: daily dependency refresh"
          commit-message: "chore: refresh compatible npm dependencies"
          body: |
            Automated daily dependency refresh.

            - Resolves compatible npm updates within the ranges already declared in package.json.
            - Runs tests, TypeScript checks, and the production build before proposing changes.
            - Review this pull request and CI results before merging.
            - This workflow does not change trading strategies, risk limits, or enable live trading.
          labels: |
            dependencies
            automated-update
          add-paths: |
            package-lock.json
